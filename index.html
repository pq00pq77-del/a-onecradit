<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A-ONE CREDIT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050708;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}
.gold{color:#d7a94b}.wrap{max-width:1200px;margin:auto;padding:20px}
header{height:70px;border-bottom:1px solid #2c2110;background:#060606}
nav{display:flex;justify-content:space-between;align-items:center;height:100%}
.logo{font-size:24px;font-weight:bold;color:#d7a94b}.menu span{margin-left:25px;font-size:14px}
.hero{min-height:420px;padding:90px 30px;background:linear-gradient(90deg,#050708 20%,rgba(5,7,8,.5)),url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1600&q=80') center/cover}
.hero h1{font-size:56px;line-height:1.2;margin:20px 0}.hero p{color:#ddd}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:-30px auto 40px}
.card{background:#0c0f12;border:1px solid #5a421b;border-radius:12px;padding:25px;text-align:center}
.form{background:#090b0e;border:1px solid #76551c;border-radius:15px;padding:40px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
input,textarea{width:100%;background:#090909;border:1px solid #493719;color:#fff;padding:15px;border-radius:6px}
button{width:100%;margin-top:20px;background:#d7a94b;border:0;padding:18px;font-weight:bold}
footer{text-align:center;padding:35px;color:#d7a94b}
@media(max-width:800px){.cards,.grid{grid-template-columns:1fr}.hero h1{font-size:38px}}
</style>
</head>
<body>
<header><nav class="wrap"><div class="logo">A-ONE CREDIT</div><div class="menu"><span>대출상담 신청</span><span>대출상품 안내</span><span>회사소개</span></div></nav></header>
<section class="hero"><div class="wrap"><div class="gold">당신의 든든한 금융 파트너</div><h1>빠르고 정확한<br><span class="gold">맞춤 대출 상담</span></h1><p>고객님의 상황에 맞는 최적의 상담을 안내해드립니다.</p></div></section>
<div class="wrap">
<div class="cards">
<div class="card"><h3 class="gold">다양한 대출 상품</h3><p>맞춤 상담 안내</p></div>
<div class="card"><h3 class="gold">빠른 심사 및 승인</h3><p>간편한 상담 진행</p></div>
<div class="card"><h3 class="gold">최저 금리 비교</h3><p>상황별 안내</p></div>
<div class="card"><h3 class="gold">전문 상담 지원</h3><p>친절한 상담</p></div>
</div>
<div class="form">
<h2 class="gold" style="text-align:center">대출 상담 신청</h2>
<form id="f"><div class="grid">
<input name="name" placeholder="이름">
<input name="phone" placeholder="연락처">
<input name="birth" placeholder="생년월일">
<input name="job" placeholder="직업">
<input name="amount" placeholder="희망 금액">
<input name="message" placeholder="문의 내용">
</div><button>상담 신청하기</button></form>
</div>
</div>
<footer>상담 가능 시간<br><b>평일 09:00 ~ 18:00</b></footer>
<script>
document.getElementById('f').onsubmit=async e=>{e.preventDefault();await fetch('/api/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});alert('접수되었습니다');}
</script>
</body></html>
