<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A-ONE CREDIT</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Arial,"Noto Sans KR",sans-serif}
.container{max-width:1100px;margin:auto;padding:20px}
.gold{color:#d8ad55}
header{border-bottom:1px solid #3d2d12;background:#080808}
nav{display:flex;justify-content:space-between;align-items:center;padding:20px}
.logo{font-size:28px;font-weight:900;color:#d8ad55}
.menu span{margin-left:20px;color:#ddd}
.hero{padding:80px 20px;text-align:center;background:linear-gradient(#050505,#111)}
.hero h1{font-size:55px}.hero p{color:#aaa;font-size:18px}
.card{background:#111;border:1px solid #5a431d;border-radius:20px;padding:35px;margin:30px 0}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.box{background:#0b0b0b;padding:25px;border-radius:15px;border:1px solid #33250f}
input,select,textarea{width:100%;padding:15px;background:#080808;border:1px solid #55401d;color:white;border-radius:10px}
form{display:grid;gap:15px}
button{background:#d8ad55;color:#111;border:0;padding:18px;border-radius:10px;font-weight:bold;font-size:18px}
footer{padding:40px;text-align:center;border-top:1px solid #33250f;color:#d8ad55}
@media(max-width:700px){.cards{grid-template-columns:1fr}.hero h1{font-size:36px}}
</style>
</head>
<body>
<header><nav class="container"><div class="logo">A-ONE CREDIT</div><div class="menu"><span>대출상담 신청</span><span>대출상품 안내</span><span>회사소개</span></div></nav></header>

<section class="hero">
<h1>빠르고 정확한<br><span class="gold">맞춤 대출 상담</span></h1>
<p>고객님의 상황에 맞는 금융 상담을 안내해드립니다.</p>
</section>

<div class="container">
<section class="card">
<h2 class="gold">회사소개</h2>
<p> A-ONE CREDIT은 고객 중심의 상담 서비스를 제공하며 빠르고 정확한 상담을 목표로 합니다.</p>
</section>

<section class="cards">
<div class="box"><h3 class="gold">맞춤 상담</h3><p>개인 상황에 맞는 상담 안내</p></div>
<div class="box"><h3 class="gold">간편 접수</h3><p>온라인으로 빠른 신청</p></div>
<div class="box"><h3 class="gold">안전 관리</h3><p>상담 목적의 정보 관리</p></div>
</section>

<section class="card">
<h2 class="gold">대출 상담 신청</h2>
<form id="applyForm">
<input name="name" placeholder="이름" required>
<input name="phone" placeholder="휴대폰번호" required>
<input name="birth" placeholder="생년월일" required>
<input name="job" placeholder="직업" required>
<input name="amount" placeholder="희망금액" required>
<textarea name="message" placeholder="문의내용"></textarea>
<button>상담 신청하기</button>
<div id="result"></div>
</form>
</section>
</div>

<footer>
상담 가능 시간<br>
<b>평일 09:00 ~ 18:00</b>
</footer>

<script>
document.getElementById("applyForm").onsubmit=async e=>{
e.preventDefault();
let r=await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});
document.getElementById("result").innerText=r.ok?"접수가 완료되었습니다.":"전송 실패";
}
</script>
</body>
</html>
